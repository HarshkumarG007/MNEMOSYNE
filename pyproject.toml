[tool.poetry]
name = "mnemosyne"
version = "0.1.0"
description = "Autonomous Multi-Agent Digital Forensics & Temporal Intelligence Platform"
authors = ["MNEMOSYNE Contributors"]
license = "MIT"
readme = "README.md"
packages = [{include = "mnemosyne", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104"
uvicorn = "^0.24"
pydantic = "^2.5"
neo4j = "^6.2.0"
tenacity = "^9.1.4"
sqlalchemy = "^2.0.51"
cryptography = "^50.0.0"
python-dotenv = "^1.2.2"
aiosqlite = "^0.22.1"
python-magic = "^0.4.27"
python-magic-bin = "^0.4.14"
aiofiles = "^25.1.0"
pypdf = "^6.14.2"
python-docx = "^1.2.0"
pytesseract = "^0.3.13"
pillow = "^12.3.0"


[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-asyncio = "^0.21"
ruff = "^0.1.5"
mypy = "^1.7"
pre-commit = "^3.5"
types-aiofiles = "^25.1.0.20260518"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]

[tool.mypy]
strict = true
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
