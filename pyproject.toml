[tool.poetry]
name = "mnemosyne"
version = "0.1.0"
description = "Autonomous Multi-Agent Digital Forensics & Temporal Intelligence Platform"
authors = ["MNEMOSYNE Contributors"]
license = "MIT"
readme = "README.md"
packages = [{include = "mnemosyne", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104"
uvicorn = "^0.24"
pydantic = "^2.5"
neo4j = "^6.2.0"
tenacity = "^9.1.4"
sqlalchemy = "^2.0.51"
cryptography = "^50.0.0"
python-dotenv = "^1.2.2"
aiosqlite = "^0.22.1"
python-magic = "^0.4.27"
python-magic-bin = "^0.4.14"
aiofiles = "^25.1.0"
pypdf = "^6.14.2"
python-docx = "^1.2.0"
pytesseract = "^0.3.13"
pillow = "^12.3.0"
llama-cpp-python = "^0.2.79"
chromadb = "^0.5.0"
huggingface-hub = "^0.23.0"
langgraph = "^1.2.10"
langchain-core = "^1.5.3"
dateparser = "^1.4.2"
python-whois = "^0.9.6"
httpx = "0.27.2"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
bcrypt = "^5.0.0"
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
slowapi = "^0.1.10"
bleach = "^6.4.0"
python-multipart = "^0.0.32"


[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-asyncio = "^0.21"
ruff = "^0.1.5"
mypy = "^1.7"
pre-commit = "^3.5"
types-aiofiles = "^25.1.0.20260518"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]

[tool.mypy]
strict = true
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
exclude = ["tests"]
